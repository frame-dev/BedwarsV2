enabled: true

# Add your own IDs under kill-effects or bed-effects.
# Use effect: CUSTOM and a particles list for particle effects without Java changes.
# Example fields on each particle layer: type: FLAME, count: 30, height: 0.5,
# spread-x: 0.5, spread-y: 0.5, spread-z: 0.5, speed: 0.02.
# REDSTONE layers also accept color: "#FFD700" and size: 1.5.
# Full copyable examples: docs/CUSTOM_COSMETICS.md in the project.

# Testing only: bypass effect permissions for everyone. Disabled effects stay disabled.
testing:
  unlock-all: false

# Each effect has a permission below. Set it to "" to allow everyone.
# Kill and bed effects use separate permissions; "none" is available by default.
# testing.unlock-all bypasses these permissions while true.
gui:
  title: "&dCosmetics"
  size: 54
  kill-slot-start: 10
  bed-slot-start: 28
  slot-step: 1
  selected-lore: "&aSelected"
  locked-lore: "&cLocked"

kill-effects:
  none:
    enabled: true
    display-name: "&7No Kill Effect"
    icon: BARRIER
    lore:
      - "&7Disable kill effects."
    effect: NONE
    permission: "bedwars.cosmetics.kill.none"
  firework:
