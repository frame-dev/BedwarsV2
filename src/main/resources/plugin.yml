name: BedWars
version: 1.2-SNAPSHOT
main: ch.framedev.BedWarsPlugin
api-version: 1.18
author: FrameDev
description: A comprehensive BedWars plugin for Minecraft
softdepend: [CloudNet-Bridge]
libraries:
  - org.xerial:sqlite-jdbc:3.45.0.0

commands:
  bedwars:
    description: Main BedWars command
    usage: /bedwars <join|leave|stats|list|setup|party|queue|vote|cosmetics|achievements|team>
    aliases: [bw]

permissions:
  bedwars.join:
    description: Allow players to join games
    default: true
  bedwars.leave:
    description: Allow players to leave games
    default: true
  bedwars.stats:
    description: Allow players to view their stats
    default: true
  bedwars.list:
    description: Allow players to list arenas
    default: true
  bedwars.spectate:
    description: Allow players to spectate games
    default: true
  bedwars.setup:
    description: Allow arena setup
    default: op
  bedwars.admin:
    description: Administrative commands
    default: op
  bedwars.bungee:
    description: BungeeCord server switching
    default: true
  bedwars.party:
    description: Party commands
    default: true
  bedwars.party.invite:
    description: Invite players to a party
    default: true
  bedwars.party.kick:
    description: Kick players from a party
    default: true
  bedwars.party.promote:
    description: Promote a party member to leader
    default: true
  bedwars.queue:
    description: Join the map voting queue
    default: true
  bedwars.vote:
    description: Vote for a map
    default: true
  bedwars.vote.admin:
    description: Admin control for map voting
    default: op
  bedwars.cosmetics:
    description: Open cosmetics menu
    default: true
  bedwars.cosmetics.kill.none:
    description: Disable kill cosmetics
    default: true
  bedwars.cosmetics.kill.firework:
    description: Use the firework kill cosmetic
    default: op
  bedwars.cosmetics.kill.heart:
    description: Use the heart kill cosmetic
    default: op
  bedwars.cosmetics.kill.smoke:
    description: Use the smoke kill cosmetic
    default: op
  bedwars.cosmetics.kill.explosion:
    description: Use the explosion kill cosmetic
    default: op
  bedwars.cosmetics.bed.none:
    description: Disable bed destroy cosmetics
    default: true
  bedwars.cosmetics.bed.lightning:
    description: Use the lightning bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.firework:
    description: Use the firework bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.explosion:
    description: Use the explosion bed destroy cosmetic
    default: op
  bedwars.achievements:
    description: Open achievements menu
    default: true
  bedwars.cosmetics.kill.flame:
    description: Use the flame kill cosmetic
    default: op
  bedwars.cosmetics.kill.soul:
    description: Use the soul kill cosmetic
    default: op
  bedwars.cosmetics.kill.portal:
    description: Use the portal kill cosmetic
    default: op
  bedwars.cosmetics.kill.enchant:
    description: Use the enchanting kill cosmetic
    default: op
  bedwars.cosmetics.kill.music:
    description: Use the music kill cosmetic
    default: op
  bedwars.cosmetics.kill.totem:
    description: Use the totem kill cosmetic
    default: op
  bedwars.cosmetics.bed.flame:
    description: Use the flame bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.soul:
    description: Use the soul bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.portal:
    description: Use the portal bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.enchant:
    description: Use the enchanting bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.music:
    description: Use the music bed destroy cosmetic
    default: op
  bedwars.cosmetics.bed.totem:
    description: Use the totem bed destroy cosmetic
    default: op
  bedwars.team:
    description: Change team in lobby
    default: true
  bedwars.sign.create:
    description: Create BedWars join signs
    default: op
